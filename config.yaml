# RTLHierDocor Project Configuration
#
# All CLI arguments can be specified here. CLI flags override these values.
# Usage: python3 -m cli generate              (uses config.yaml defaults)
#        python3 -m cli generate -t other_top  (overrides top_module only)

# ── Design source ──────────────────────────────────────────────
design:
  filelist: "$CODE_BASE_PATH/gen_rtl/filelists/C910_asic_rtl.fl"
  top_module: "openC910"
  # rtlil: ""                  # Alternative: pre-compiled RTLIL path

# ── Output settings ───────────────────────────────────────────
output:
  dir: "./rtl_docs"
  cache_dir: ".rtl_cache"
  max_schematics: 0            # 0 = generate all

# ── Schematic simplification ──────────────────────────────────
simplify:
  enabled: true
  strategy: "proc_group"       # proc_group | connected_component

  # I/O port signals matching these patterns are removed from
  # simplified schematics along with their connected paths.
  # Uses fnmatch-style wildcards: * matches anything, ? matches one char.
  # remove_signals:
  #   - "cpurst_b"
  #   - "*rst_b"
  #   - "*_rst_b"
  #   - "pad_yy_icg_scan_en"
  #   - "*scan_en*"

# ── General ───────────────────────────────────────────────────
verbose: true

# ── Agent Docor ────────────────────────────────────────────────
agent:
  backend: "openai"              # anthropic | openai | agent_sdk
  model: "glm-4.7"
  base_url: "https://open.bigmodel.cn/api/paas/v4/"                      # Custom LLM API base URL if needed
  thinking: true                   # Enable thinking/reasoning mode
  skip_modules:                     # Modules matching these patterns will be skipped
    - "ct_had*"
  max_source_lines: 10000            # Truncate source files after N lines
  resume: true                      # Resume from last checkpoint
  code_base_path: "$CODE_BASE_PATH" # Base path for source file resolution
  max_modules: 0                    # 0 = all, N = limit for debugging
  api_key: "941daa47276a40998a357e4485b03581.cjwMaOjjocv3xJXa"    # Or use ANTHROPIC_API_KEY env var
