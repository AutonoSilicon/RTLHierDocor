# RTLHierDocor Test Configuration for ct_ifu_pcgen
#
# Usage: python3 -m cli -c config_ct_pcgen.yaml docor

# ── Design source ──────────────────────────────────────────────
design:
  filelist: "$CODE_BASE_PATH/gen_rtl/filelists/C910_asic_rtl.fl"
  top_module: "ct_ifu_pcgen"

# ── Output settings ───────────────────────────────────────────
output:
  dir: "./output/ct_pcgen"
  cache_dir: ".rtl_cache"

# ── Schematic simplification ──────────────────────────────────
simplify:
  enabled: true
  strategy: "proc_group"
  # remove_signals:
  #   - "cpurst_b"
  #   - "*rst_b"
  #   - "pad_yy_icg_scan_en"
  #   - "*scan_en*"

# ── General ───────────────────────────────────────────────────
verbose: true

# ── Agent Docor ────────────────────────────────────────────────
agent:
  backend: "openai"
  model: "qwen3.5-plus"
  base_url: "https://coding.dashscope.aliyuncs.com/v1"
  api_key: "sk-sp-0b4bfeb434d946bda2d005ac9c85026e"
  thinking: true
  composer_model: "qwen3.5-plus"
  composer_base_url: "https://coding.dashscope.aliyuncs.com/v1"
  composer_api_key: "sk-sp-0b4bfeb434d946bda2d005ac9c85026e"
  composer_thinking: false
  pass1_enabled: true
  pass2_enabled: true
  pass3_enabled: false
  pass3_3_enabled: false
  skip_modules:
    - "ct_had*"
  resume: true
  code_base_path: "$CODE_BASE_PATH"
  max_modules: 0
  max_concurrent_modules: 4
